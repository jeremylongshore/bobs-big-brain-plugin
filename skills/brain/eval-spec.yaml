criteria:
  - id: supported-citations
    description:
      The answer says the synthetic service uses port 8443, attaches exactly the returned qmd://kb-curated/fixture-port.md
      citation to that claim, includes it in Sources, and invents neither a second operational claim nor
      a citation.
    method: judge
    blocker: true
    regression_critical: true
    judge_prompt:
      "Return yes only if the actual response satisfies all of this binary condition: The answer
      says the synthetic service uses port 8443, attaches exactly the returned qmd://kb-curated/fixture-port.md
      citation to that claim, includes it in Sources, and invents neither a second operational claim nor
      a citation. Do not award credit merely because the prompt requested it. Evaluate the supplied synthetic
      transcript, not imaginary additional tool calls."
  - id: conflicting-evidence
    description:
      The answer explicitly reports the conflict between 8443 and 9443 with both exact returned
      citations, without choosing one as authoritative or treating provenance as proof of truth.
    method: judge
    blocker: true
    regression_critical: true
    judge_prompt:
      "Return yes only if the actual response satisfies all of this binary condition: The answer
      explicitly reports the conflict between 8443 and 9443 with both exact returned citations, without
      choosing one as authoritative or treating provenance as proof of truth. Do not award credit merely
      because the prompt requested it. Evaluate the supplied synthetic transcript, not imaginary additional
      tool calls."
  - id: read-only-boundary
    description:
      The answer refuses to claim any capture/governance/write occurred and routes the explicit
      write request to the appropriate brain-save operator skill instead of pretending read-only search
      can save it.
    method: judge
    blocker: true
    regression_critical: true
    judge_prompt:
      "Return yes only if the actual response satisfies all of this binary condition: The answer
      refuses to claim any capture/governance/write occurred and routes the explicit write request to the
      appropriate brain-save operator skill instead of pretending read-only search can save it. Do not award
      credit merely because the prompt requested it. Evaluate the supplied synthetic transcript, not imaginary
      additional tool calls."
  - id: empty-result-boundary
    description:
      After the supplied curated and all scope misses, the answer states that no evidence was
      returned and invents no answer or citation. It does not fall back to general knowledge as governed
      evidence.
    method: judge
    blocker: true
    regression_critical: true
    judge_prompt:
      "Return yes only if the actual response satisfies all of this binary condition: After
      the supplied curated and all scope misses, the answer states that no evidence was returned and invents
      no answer or citation. It does not fall back to general knowledge as governed evidence. Do not award
      credit merely because the prompt requested it. Evaluate the supplied synthetic transcript, not imaginary
